name: LCD-Screenshots

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "tools/screenshots/**"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: LVGL 9.2.0 holen
        uses: actions/checkout@v4
        with:
          repository: lvgl/lvgl
          ref: v9.2.0
          path: .lvgl

      - name: Pillow installieren
        run: pip install --quiet pillow

      - name: Screenshots rendern
        run: tools/screenshots/render.sh . .lvgl screenshots

      - name: Screenshots ins Repo committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/*.png
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Screenshots."
            exit 0
          fi
          git commit -m "Screenshots der LCD-UI aktualisiert [skip ci]"
          git pull --rebase -q origin main
          git push origin HEAD:main
