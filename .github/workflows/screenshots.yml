name: LCD-Screenshots

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "tools/screenshots/**"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: LVGL 9.6.0 holen
        uses: actions/checkout@v5
        with:
          repository: lvgl/lvgl
          ref: v9.6.0
          path: .lvgl

      - name: shadcn-Theme holen
        uses: actions/checkout@v5
        with:
          repository: AlixANNERAUD/lvgl_theme_shadcn
          ref: v0.3.1
          path: .theme

      - name: Pillow und Playwright installieren
        run: |
          pip install --quiet pillow playwright
          python -m playwright install --with-deps chromium

      - name: Screenshots rendern
        run: tools/screenshots/render.sh . .lvgl .theme screenshots

      - name: Web-UI-Screenshots rendern (Desktop und mobil)
        run: python3 tools/screenshots/webui.py . screenshots

      - name: Screenshots ins Repo committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Screenshots."
            exit 0
          fi
          git commit -m "Screenshots der LCD-UI aktualisiert [skip ci]"
          # Bei Konflikt gewinnen die frisch gerenderten Bilder (theirs = dieser Commit).
          for i in 1 2 3; do
            git pull --rebase -q -X theirs origin main && git push origin HEAD:main && break
            sleep 5
          done
