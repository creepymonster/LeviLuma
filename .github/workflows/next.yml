name: Next

on:
  push:
    branches: [main]
    paths:
      - "next/**"
      - ".github/workflows/next.yml"
  pull_request:
    paths:
      - "next/**"
      - ".github/workflows/next.yml"
  workflow_dispatch:

jobs:
  host-tests:
    name: Host-Tests (Protokoll, Gateway, Controller)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Tests bauen und ausfuehren
        run: next/tests/run_tests.sh

  firmware:
    name: ESP-IDF ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.6
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Gateway (esp32s3)
            dir: next/gateway
            target: esp32s3
            args: ""
          - name: Controller ohne Zigbee (esp32c5)
            dir: next/controller
            target: esp32c5
            args: ""
          - name: Controller mit Zigbee (esp32c5)
            dir: next/controller
            target: esp32c5
            args: '-B build-zigbee -D SDKCONFIG=build-zigbee/sdkconfig -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.zigbee"'
    steps:
      - uses: actions/checkout@v5
      - name: Bauen
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          git config --global --add safe.directory '*'
          cd ${{ matrix.dir }}
          idf.py ${{ matrix.args }} set-target ${{ matrix.target }} build
