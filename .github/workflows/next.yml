name: Next Firmware

# Host-Tests laufen separat in tests.yml.

on:
  push:
    branches: [main]
    paths:
      - "controller/**"
      - "controller-round/**"
      - "debug/**"
      - "docs/**"
      - "gateway/**"
      - "screenshots/**"
      - "shared/**"
      - "simulator/**"
      - "tests/**"
      - "tools/**"
      - "README.md"
      - ".github/workflows/next.yml"
  pull_request:
    paths:
      - "controller/**"
      - "controller-round/**"
      - "debug/**"
      - "docs/**"
      - "gateway/**"
      - "screenshots/**"
      - "shared/**"
      - "simulator/**"
      - "tests/**"
      - "tools/**"
      - "README.md"
      - ".github/workflows/next.yml"
  workflow_dispatch:

jobs:
  firmware:
    name: ESP-IDF ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.6
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Gateway (esp32s3)
            dir: gateway
            target: esp32s3
            args: ""
          - name: Controller ohne Zigbee (esp32c5)
            dir: controller
            target: esp32c5
            args: ""
          - name: Round Controller (esp32s3)
            dir: controller-round
            target: esp32s3
            args: ""
          - name: Diagnose ESP-NOW (esp32s3)
            dir: debug
            target: esp32s3
            args: ""
            build: build
          - name: Diagnose ESP-NOW, alle Optionen (esp32s3)
            dir: debug
            target: esp32s3
            args: '-B build-full -D SDKCONFIG=build-full/sdkconfig -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.full"'
            build: build-full
          - name: Controller mit Zigbee (esp32c5)
            dir: controller
            target: esp32c5
            args: '-B build-zigbee -D SDKCONFIG=build-zigbee/sdkconfig -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.zigbee"'
    steps:
      - uses: actions/checkout@v5
      - name: Bauen
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          git config --global --add safe.directory '*'
          cd ${{ matrix.dir }}
          idf.py ${{ matrix.args }} set-target ${{ matrix.target }} build
          if [ "${{ matrix.dir }}" = "controller-round" ]; then
            python3 ${GITHUB_WORKSPACE}/tools/check_round_build.py build
          fi
          # Diagnosegeraet: passive Arbeitsweise pruefen (keine Sende-, Kopplungs-, NVS-Aufrufe; kein BLE/Zigbee/LVGL)
          if [ "${{ matrix.dir }}" = "debug" ]; then
            python3 ${GITHUB_WORKSPACE}/tools/check_debug_build.py ${{ matrix.build }}
          fi
